<title>OP PDF</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%20120%20120%22%3E%3Cdefs%3E%3ClinearGradient%20id=%22op-g%22%20gradientUnits=%22userSpaceOnUse%22%20x1=%2222%22%20y1=%2232%22%20x2=%2299%22%20y2=%2285%22%3E%3Cstop%20offset=%220%22%20stop-color=%22%238db0ff%22/%3E%3Cstop%20offset=%22.5%22%20stop-color=%22%232f62e0%22/%3E%3Cstop%20offset=%221%22%20stop-color=%22%231d3fa6%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Cg%20transform=%22translate%2860%2060%29%20scale%281.4%29%20translate%28-60.5%20-57.5%29%22%3E%3Cg%20transform=%22translate%283%200%29%22%20fill=%22none%22%20stroke=%22url%28%23op-g%29%22%20stroke-width=%2210%22%20stroke-linecap=%22round%22%20stroke-linejoin=%22round%22%3E%3Cpath%20d=%22M58.9%2053.8A18%2018%200%201%201%2048.2%2043.1%22/%3E%3Cpath%20d=%22M72%2080V42h8a11%2011%200%200%201%200%2022h-8%22/%3E%3C/g%3E%3Cpath%20d=%22M61%2030l2.2%205.8L69%2038l-5.8%202.2L61%2046l-2.2-5.8L53%2038l5.8-2.2z%22%20fill=%22%23f6c9e4%22/%3E%3C/g%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the paper desk fills the screen; two floating glass panels sit above it:
   a slim header (file, zoom, theme) and a draggable tool dock (drawing tools). */
:root{
  --desk-a:#e9eef7; --desk-b:#dfe3f3; --blob-1:#b9d3ff; --blob-2:#f6c9e4; --blob-3:#c6f0e1;
  --glass:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.78); --glass-edge:rgba(255,255,255,.85); --glass-line:rgba(30,40,70,.10);
  --hi:rgba(255,255,255,.95); --lo:rgba(255,255,255,.25);
  --ink:#141a26; --muted:#556074; --accent:#2f62e0; --accent-soft:rgba(47,98,224,.13); --on-accent:#ffffff;
  --paper:#ffffff; --danger:#c3261b;
  --shadow:0 1px 2px rgba(20,28,45,.12),0 10px 30px rgba(20,28,45,.10);
  --panel-shadow:0 12px 40px rgba(30,40,80,.16),0 2px 6px rgba(30,40,80,.08);
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk-a:#10131b; --desk-b:#161a25; --blob-1:#1f3a7a; --blob-2:#4d2147; --blob-3:#123f3a;
  --glass:rgba(38,44,58,.50); --glass-strong:rgba(44,50,66,.85); --glass-edge:rgba(255,255,255,.16); --glass-line:rgba(255,255,255,.08);
  --hi:rgba(255,255,255,.22); --lo:rgba(255,255,255,.03);
  --ink:#eef1f7; --muted:#a4adbf; --accent:#8db0ff; --accent-soft:rgba(141,176,255,.18); --on-accent:#0d1430;
  --paper:#ffffff; --danger:#ff8a80;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 34px rgba(0,0,0,.45);
  --panel-shadow:0 14px 44px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk-a:#10131b; --desk-b:#161a25; --blob-1:#1f3a7a; --blob-2:#4d2147; --blob-3:#123f3a;
  --glass:rgba(38,44,58,.50); --glass-strong:rgba(44,50,66,.85); --glass-edge:rgba(255,255,255,.16); --glass-line:rgba(255,255,255,.08);
  --hi:rgba(255,255,255,.22); --lo:rgba(255,255,255,.03);
  --ink:#eef1f7; --muted:#a4adbf; --accent:#8db0ff; --accent-soft:rgba(141,176,255,.18); --on-accent:#0d1430;
  --paper:#ffffff; --danger:#ff8a80;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 34px rgba(0,0,0,.45);
  --panel-shadow:0 14px 44px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3); color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--desk-a);color:var(--ink);font-family:var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}

/* ---- glass material ---- */
.glass{position:relative;background:var(--glass);
  -webkit-backdrop-filter:blur(26px) saturate(185%);backdrop-filter:blur(26px) saturate(185%);
  border:1px solid var(--glass-edge);
  box-shadow:var(--panel-shadow),inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--lo)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg,var(--hi) 0%,transparent 38%,transparent 70%,var(--lo) 100%);opacity:.55;mix-blend-mode:soft-light}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:var(--glass-strong)}}

/* ---- header ---- */
.top{position:fixed;z-index:6;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  border-radius:26px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:6px 8px}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;padding:0 6px 0 4px;min-width:0}
.logo{width:30px;height:30px;display:grid;place-items:center;flex:none}
.logo svg{width:30px;height:30px}
.brand small{font-family:var(--f-mono);font-weight:400;color:var(--muted);font-size:11.5px;max-width:24ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spacer{flex:1}
.dirtydot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.badge{align-self:flex-start;margin:0 4px;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 9px}
.dlg-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:16px}
.seg{display:flex;align-items:center;gap:2px}
.sep{width:1px;align-self:stretch;margin:6px 4px;background:var(--glass-line)}

.btn{border:0;background:transparent;border-radius:999px;height:36px;min-width:36px;padding:0 9px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--ink);transition:background .15s,transform .12s}
.btn:hover{background:var(--accent-soft)}
.btn:active{transform:scale(.94)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 10px color-mix(in srgb,var(--accent) 40%,transparent)}
.btn:disabled{opacity:.35;cursor:default;background:transparent;transform:none}
.btn.primary{background:var(--accent);color:var(--on-accent);font-weight:700;padding:0 14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn svg.chev{width:9px;height:9px;margin-left:-2px;stroke-width:1.6;opacity:.7}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lbl{font-size:13px;font-weight:600}
#zoomLbl,#pageLbl{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
#pageLbl{border:0;background:transparent;border-radius:999px;height:30px;padding:0 8px;cursor:pointer}
#pageLbl:hover{background:var(--accent-soft);color:var(--ink)}
.pagego{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pagego input{width:46px;height:28px;border-radius:999px;border:1px solid var(--accent);background:var(--glass-strong);color:var(--ink);font:inherit;text-align:center;padding:0 4px;outline:none;-moz-appearance:textfield}
.pagego input::-webkit-inner-spin-button,.pagego input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

/* theme switch */
.themes{display:flex;background:var(--accent-soft);border-radius:999px;padding:2px}
.themes .btn{height:32px;min-width:32px;border-radius:999px;padding:0 6px}
.themes .btn[aria-pressed="true"]{background:var(--glass-strong);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}

/* ---- floating dock ---- */
.dock{position:fixed;z-index:7;border-radius:999px;display:flex;align-items:center;gap:4px;padding:6px;touch-action:none;user-select:none;-webkit-user-select:none}
.dock.vertical{border-radius:28px;flex-direction:column;max-height:calc(100% - 140px - env(safe-area-inset-top,0px));overflow-y:auto}
.dock.vertical .sep{width:auto;height:1px;margin:4px 6px;align-self:stretch}
.dock.vertical .seg{flex-direction:column}
.dock.vertical .tray{flex-direction:column}
.tray{display:flex;align-items:center;gap:2px}
.penchip{position:relative;width:40px;height:40px;border-radius:999px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--ink);transition:background .15s,transform .12s}
.penchip:hover{background:var(--accent-soft)}
.penchip:active{transform:scale(.94)}
.penchip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.penchip svg{width:24px;height:24px;stroke:var(--ink);stroke-width:1.3;stroke-linejoin:round;transition:transform .15s}
.penchip i{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:16px;border-radius:999px}
.penchip[aria-pressed="true"]{background:var(--glass-strong);box-shadow:0 0 0 2px var(--accent),0 3px 10px color-mix(in srgb,var(--accent) 30%,transparent)}
.penchip[aria-pressed="true"] svg{transform:translateY(-3px)}
.penchip.add svg{stroke:var(--muted);stroke-width:1.8;fill:none;stroke-linecap:round}
.tw{display:inline-flex;align-items:center;position:relative}
.tw .btn{position:relative}
.cbar{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);width:16px;height:3px;border-radius:999px;background:currentColor}
.btn[aria-pressed="true"] .cbar{box-shadow:0 0 0 1.5px var(--on-accent)}
.caret{width:16px;height:30px;margin-left:-3px;border:0;background:transparent;border-radius:999px;display:grid;place-items:center;cursor:pointer;color:var(--muted);padding:0}
.caret:hover{background:var(--accent-soft);color:var(--ink)}
.caret:focus-visible{outline:2px solid var(--accent)}
.caret svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dock.vertical .tw{flex-direction:column}
.dock.vertical .caret{width:30px;height:14px;margin:-3px 0 0}
.quick .penchip,.quick .btn{flex:none}
.qadd{width:40px;height:40px;border-radius:999px;border:1.5px dashed var(--glass-line);background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.qadd:hover{color:var(--accent);border-color:var(--accent)}
.qadd svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round}
.qfixed{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.qfixed button{display:flex;align-items:center;gap:8px;border:0;background:transparent;border-radius:999px;padding:6px 10px;cursor:pointer;font-size:12.5px;color:var(--ink);text-align:left}
.qfixed button:hover{background:var(--accent-soft)}
.qfixed button:disabled{opacity:.4;cursor:default;background:transparent}
.qfixed svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pgo{align-self:stretch;height:38px}
.pop{position:fixed;z-index:27;border-radius:24px;padding:12px;width:272px;max-width:calc(100vw - 16px);display:flex;flex-direction:column;gap:12px;background:var(--glass-strong)}
.pop h3{margin:0;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ptabs{display:flex;background:var(--accent-soft);border-radius:999px;padding:2px}
.ptabs button{flex:1;border:0;padding:0 7px;white-space:nowrap;background:transparent;border-radius:999px;height:32px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.ptabs button[aria-pressed="true"]{background:var(--glass-strong);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.pcolors{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;justify-items:center}
.psizes{display:flex;flex-wrap:wrap;gap:4px}
.psizes button{border:0;background:transparent;border-radius:999px;height:34px;padding:0 10px;display:flex;align-items:center;gap:6px;cursor:pointer;font-size:11.5px;font-family:var(--f-mono);color:var(--ink)}
.psizes button:hover{background:var(--accent-soft)}
.psizes button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.pdel{align-self:flex-start;border:0;background:transparent;color:var(--danger);font-size:12.5px;font-weight:600;border-radius:999px;padding:6px 10px;cursor:pointer}
.pdel:hover{background:var(--accent-soft)}
.quick{z-index:8;border-radius:999px}
.quick .btn{height:42px;min-width:42px}
.qlist{display:flex;flex-direction:column;gap:2px;max-height:46vh;overflow:auto;margin:0 -4px;padding:0 4px}
.qrow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:999px;font-size:13.5px}
.qrow:hover{background:var(--accent-soft)}
.qrow input{accent-color:var(--accent);width:18px;height:18px}
.qrow .qi{width:32px;height:32px;display:grid;place-items:center}
.qrow .qi svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.qrow .qi .penchip{pointer-events:none;width:32px;height:32px}
.qrow .mv{margin-left:auto;display:flex;gap:2px}
.qrow .mv button{width:28px;height:28px;border-radius:50%;border:0;background:transparent;cursor:pointer;color:var(--muted)}
.qrow .mv button:hover{background:var(--glass-strong);color:var(--ink)}
.grip{width:18px;height:36px;display:grid;place-items:center;cursor:grab;color:var(--muted);border-radius:999px;border:0;background:transparent;padding:0}
.grip:active{cursor:grabbing}
.grip svg{width:10px;height:18px;fill:currentColor}
.dock.vertical .grip{width:36px;height:18px}
.dock.vertical .grip svg{transform:rotate(90deg)}
.dock .btn{border-radius:999px;height:40px;min-width:40px}
.sw{width:24px;height:24px;border-radius:50%;border:0;cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18),inset 0 2px 3px rgba(255,255,255,.45);transition:transform .12s}
.sw:hover{transform:scale(1.12)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--glass-strong),0 0 0 4px var(--accent)}
.sw:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#swatches{display:flex;align-items:center;gap:6px;padding:0 4px}
.colorpick{position:relative;width:24px;height:24px;border-radius:50%;background:conic-gradient(red,#ff0,lime,cyan,blue,#f0f,red);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.colorpick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.sizes .btn{min-width:40px;width:40px;padding:0}
.dot{display:block;border-radius:50%;background:currentColor}

/* ---- desk & pages ---- */
.desk{position:fixed;inset:0;overflow:auto;
  background:
    radial-gradient(40vmax 40vmax at 8% 12%,var(--blob-1),transparent 70%),
    radial-gradient(38vmax 38vmax at 92% 30%,var(--blob-2),transparent 70%),
    radial-gradient(42vmax 42vmax at 50% 105%,var(--blob-3),transparent 70%),
    linear-gradient(180deg,var(--desk-a),var(--desk-b));
  background-attachment:fixed;
  padding-top:calc(86px + env(safe-area-inset-top,0px));padding-bottom:140px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#pages{display:flex;flex-direction:column;align-items:center;gap:30px;width:max-content;min-width:100%;margin:0 auto}
.page{position:relative;background:var(--paper);box-shadow:var(--shadow);flex:none;border-radius:2px}
.page canvas{position:absolute;left:0;top:0;width:100%}
.page .c-hl,.page .c-ui{mix-blend-mode:multiply}
.page .c-ui{height:100%;touch-action:none}
body.finger-scroll .page .c-ui, body.tool-hand .page .c-ui{touch-action:pan-x pan-y}
body.tool-pen .c-ui,body.tool-hl .c-ui,body.tool-eraser .c-ui,body.tool-shape .c-ui,body.tool-note .c-ui{cursor:var(--tool-cursor,crosshair)}
body.tool-texthl .c-ui,body.tool-text .c-ui{cursor:text}
.tedit{position:absolute;z-index:4;margin:0;padding:0;border:0;outline:1.5px dashed var(--accent);outline-offset:3px;background:transparent;resize:none;overflow:hidden;
  font-family:Helvetica,Arial,sans-serif;line-height:1.25;white-space:pre;min-width:2ch;caret-color:var(--accent)}
body.tool-lasso .c-ui{cursor:var(--tool-cursor,crosshair)}
body.tool-hand .c-ui{cursor:grab}
body.tool-pointer .c-ui{cursor:default}
.page .textLayer{position:absolute;left:0;top:0;overflow:hidden;opacity:1;line-height:1;text-align:initial;-webkit-text-size-adjust:none;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:2;display:none}
body.tool-pointer .page .textLayer{display:block}
.page .textLayer :is(span,br){color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
.page .textLayer span.markedContent{top:0;height:0}
.page .textLayer ::selection{background:rgba(47,98,224,.32)}
.page .textLayer br::selection{background:transparent}
.page .textLayer .endOfContent{display:block;position:absolute;inset:100% 0 0;z-index:-1;cursor:default;user-select:none}
.page .textLayer .endOfContent.active{top:0}
.pnum{position:absolute;left:0;top:-20px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.grow{position:absolute;left:50%;bottom:-19px;transform:translateX(-50%);display:flex;gap:6px;opacity:0;transition:opacity .15s}
.page:hover .grow,.grow:focus-within{opacity:1}
.grow button{font-size:11px;font-weight:600;border:1px solid var(--glass-edge);background:var(--glass-strong);color:var(--muted);border-radius:20px;padding:2px 11px;cursor:pointer;white-space:nowrap}
.grow button:hover{color:var(--accent)}
.selbar{position:absolute;display:flex;gap:2px;border-radius:999px;padding:3px;z-index:3}
.selbar button{font-size:12px;font-weight:600;border:0;background:transparent;border-radius:999px;padding:5px 11px;cursor:pointer;color:var(--ink);position:relative}
.selbar button:hover{background:var(--accent-soft)}
.selbar .del{color:var(--danger)}
.drop{position:fixed;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 16%,transparent);border:3px dashed var(--accent);z-index:20;font-size:20px;font-weight:700;color:var(--ink);pointer-events:none}
.toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:30;max-width:calc(100vw - 32px)}
.dock.summoned{animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.panel{position:fixed;z-index:26;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100vw - 32px));max-height:calc(100% - 40px);overflow:auto;border-radius:28px;padding:18px 18px 14px;background:var(--glass-strong)}
.panel .fin{display:block;width:100%;box-sizing:border-box;margin:4px 0 10px;padding:9px 12px;border-radius:12px;border:1px solid var(--line,rgba(0,0,0,.14));background:var(--glass,rgba(255,255,255,.6));color:var(--ink);font:14px var(--f-ui,system-ui)}
.panel textarea.fin{font:14px/1.45 var(--f-mono,ui-monospace,monospace);resize:vertical;min-height:64px}
.panel .flab{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.eqkeys{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 6px}
.eqkeys button{min-width:34px;height:30px;padding:0 8px;border:0;border-radius:9px;background:var(--accent-soft);color:var(--ink);font:600 13px var(--f-ui,system-ui);cursor:pointer}
.eqkeys button:hover{filter:brightness(.95)}
.eqpad{position:relative;margin:2px 0 8px}
.eqpad canvas{display:block;width:100%;height:190px;border-radius:14px;background:#fff;border:1px solid rgba(0,0,0,.1);touch-action:none;cursor:crosshair}
.eqpad .eqpadbar{position:absolute;right:8px;top:8px;display:flex;gap:4px}
.eqpad .eqpadbar button{height:28px;padding:0 10px;border:0;border-radius:999px;background:rgba(47,98,224,.12);color:#1d1d1f;font:600 12px var(--f-ui,system-ui);cursor:pointer}

/* ---------- recent files (IndexedDB, this browser only) ---------- */
let currentId = null;
const recents = (() => {

const rtf = new Intl.RelativeTimeFormat("fr", { numeric: "auto" });

  if (a < 86400) return rtf.format(Math.round(s / 3600), "hour");
  if (a < 86400 * 7) return rtf.format(Math.round(s / 86400), "day");
